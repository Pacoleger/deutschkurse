<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 Abschlusstest 4</title>
<style>
:root{
--tinte:#1b2a41;
--papier:#f5f7fa;
--sonne:#ffc83d;
--meer:#1f7a8c;
--weiss:#fff;
--linie:#d5dce5;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--papier);
font-family:"Segoe UI",sans-serif;
color:var(--tinte);
}
.wrap{
max-width:900px;
margin:auto;
padding:20px;
}
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}
h1,h2{margin-top:0;}
input[type=text],
input[type=email]{
width:100%;
padding:12px;
margin-bottom:15px;
border:2px solid var(--linie);
border-radius:10px;
font-size:16px;
}
.btn{
background:var(--tinte);
color:white;
border:none;
padding:14px 25px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}
.btn:hover{background:#101d31;}
.frage{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:1px solid var(--linie);
}
.option{
display:block;
margin:8px 0;
cursor:pointer;
}
.progress{
width:100%;
height:25px;
background:#e4eaf2;
border-radius:999px;
overflow:hidden;
margin:20px 0;
}
.bar{
width:100%;
height:100%;
background:var(--sonne);
}
.ergebnis{text-align:center;}
.level{
font-size:42px;
font-weight:bold;
margin:15px 0;
}
.bestanden{
color:green;
font-size:30px;
font-weight:bold;
}
.nichtbestanden{
color:#c62828;
font-size:30px;
font-weight:bold;
}
a{
color:var(--meer);
text-decoration:none;
font-weight:bold;
}
</style>
</head>
<body>

<div class="wrap">

<div class="card" id="start">

<h1>🚶📗 A2 Abschlusstest 4</h1>

<p>
A2 Abschlussprüfung Variante 4 ⭐⭐⭐⭐
<br>
Schwerpunkte: Perfekt, Nebensätze, indirekte Fragen,
trennbare Verben, Wechselpräpositionen und Berufssprache.
</p>

<label>👤 Vorname</label>
<input type="text" id="vorname">

<label>📧 E-Mail</label>
<input type="email" id="email">

<label>
<input type="checkbox" id="zustimmung">
Ich stimme der Speicherung und Übermittlung meines Ergebnisses zu.
</label>

<br><br>

<button class="btn" onclick="starten()">
🚀 Test starten
</button>

</div>

<div class="card" id="test" style="display:none;">

<h2>📚 A2 Abschlussprüfung</h2>

<div class="progress">
<div class="bar"></div>
</div>

<div id="fragen"></div>

<button class="btn" onclick="auswerten()">
✅ Test auswerten
</button>

</div>

<div class="card" id="ergebnis" style="display:none;"></div>

</div>

<script>

const ACCESS_KEY="DEIN_WEB3FORMS_ACCESS_KEY";

const fragen=[

["Ich habe meinen Freund gestern ___ .",["angerufen","anrufen","rufe an"],0],

["Wir sind am Wochenende in die Berge ___ .",["gefahren","fahren","fahrt"],0],

["Kannst du mir sagen, ___ der nächste Bus fährt?",["wann","wo","ob"],0],

["Sie hat mir erzählt, ___ sie umzieht.",["dass","weil","wenn"],0],

["Wenn ich früher aufstehe, ___ ich mehr Zeit.",["habe","hat","haben"],0],

["Der Termin, ___ ich habe, ist am Dienstag.",["den","der","dem"],0],

["Ich weiß nicht, ___ er heute kommt.",["ob","dass","weil"],0],

["Er hat sich ___ die Stelle beworben.",["um","für","auf"],0],

["Das Formular muss bis Freitag ___ werden.",["ausgefüllt","ausfüllen","ausfüllt"],0],

["Ich habe vergessen, die E-Mail ___ .",["abzuschicken","abschicken","abgeschickt"],0],

["Nachdem ich ___ hatte, ging ich ins Büro.",["gefrühstückt","frühstücken","frühstückte"],0],

["Die Firma, ___ ich arbeite, ist international.",["bei der","bei die","bei dem"],0],

["Bevor ich nach Deutschland kam, ___ ich schon etwas Deutsch.",["lernte","lerne","gelernt"],0],

["Könnten Sie mir bitte sagen, ___ das Meeting beginnt?",["wann","wo","wie"],0],

["Der Kollege, ___ ich gestern gesprochen habe, ist krank.",["mit dem","mit den","mit der"],0],

["Ich lasse mein Auto morgen ___ .",["reparieren","repariert","repariere"],0],

["Wir haben uns ___ die neue Kollegin gefreut.",["über","auf","für"],0],

["Er tut so, ___ er alles verstanden hätte.",["als ob","weil","dass"],0],

["___ ich Zeit habe, rufe ich dich an.",["Sobald","Damit","Trotzdem"],0],

["Meine Schwester hat mich gebeten, ihr ___ helfen.",["zu","beim","für"],0]

];

let vorname="";
let email="";

function starten(){

vorname=document.getElementById("vorname").value.trim();
email=document.getElementById("email").value.trim();

if(!vorname){
alert("Bitte Vorname eingeben.");
return;
}

if(!email){
alert("Bitte E-Mail eingeben.");
return;
}

if(!document.getElementById("zustimmung").checked){
alert("Bitte Zustimmung aktivieren.");
return;
}

document.getElementById("start").style.display="none";
document.getElementById("test").style.display="block";

fragenAufbauen();

}

function fragenAufbauen(){

let html="";

fragen.forEach((f,index)=>{

html+=`
<div class="frage">
<h3>${index+1}. ${f[0]}</h3>
`;

f[1].forEach((antwort,aindex)=>{

html+=`
<label class="option">
<input type="radio" name="f${index}" value="${aindex}">
${antwort}
</label>
`;

});

html+=`</div>`;

});

document.getElementById("fragen").innerHTML=html;

}

async function auswerten(){

let punkte=0;
let offen=0;

fragen.forEach((f,index)=>{

const auswahl=document.querySelector(
'input[name="f'+index+'"]:checked'
);

if(!auswahl){
offen++;
return;
}

if(Number(auswahl.value)===f[2]){
punkte++;
}

});

if(offen>0){
alert("Bitte alle Fragen beantworten.");
return;
}

const prozent=Math.round(
(punkte/fragen.length)*100
);

const bestanden=prozent>=70;

document.getElementById("test").style.display="none";
document.getElementById("ergebnis").style.display="block";

document.getElementById("ergebnis").innerHTML=`

<div class="ergebnis">

<h2>🏆 Ergebnis A2 Test 4</h2>

<h3>${vorname}</h3>

<div class="level">
${prozent}%
</div>

<p>
${punkte} von ${fragen.length} Punkten
</p>

<div class="${
bestanden
?
"bestanden"
:
"nichtbestanden"
}">
${bestanden
?
"✅ Bestanden"
:
"❌ Nicht bestanden"}
</div>

<p>
Niveau:
<strong>A2</strong>
</p>

${
bestanden
?
"<p>🎉 Sehr gut! Du beherrschst auch komplexere A2-Strukturen.</p>"
:
"<p>📚 Wiederhole Nebensätze, Perfekt und indirekte Fragen und versuche es erneut.</p>"
}

<br><br>

<a href="index.html">
🏠 Zur Startseite
</a>

</div>

`;

sendenErgebnis(
punkte,
prozent,
bestanden
);

}

async function sendenErgebnis(
punkte,
prozent,
bestanden
){

try{

await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({

access_key:ACCESS_KEY,

subject:
"A2 Abschlusstest 4 - " + vorname,

Vorname:vorname,
Email:email,

Test:"A2 Abschlusstest 4",

Punkte:
punkte + "/" + fragen.length,

Prozent:prozent,

Ergebnis:
bestanden
?
"Bestanden"
:
"Nicht bestanden"

})
}
);

}catch(error){

console.log(error);

}

}

</script>

</body>
</html>
