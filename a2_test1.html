<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>A2 Abschlusstest 1</title>
 
<style>
 
:root{
--tinte:#1b2a41;
--papier:#f5f7fa;
--sonne:#ffc83d;
--meer:#1f7a8c;
--weiss:#fff;
--linie:#d5dce5;
}
 
*{
box-sizing:border-box;
}
 
body{
margin:0;
background:var(--papier);
font-family:"Segoe UI",sans-serif;
color:var(--tinte);
}
 
.wrap{
max-width:900px;
margin:auto;
padding:20px;
}
 
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}
 
h1,h2{
margin-top:0;
}
 
input[type=text],
input[type=email]{
width:100%;
padding:12px;
margin-bottom:15px;
border:2px solid var(--linie);
border-radius:10px;
}
 
.btn{
background:var(--tinte);
color:white;
border:none;
padding:14px 25px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}
 
.btn:hover{
background:#101d31;
}
 
.frage{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:1px solid var(--linie);
}
 
.option{
display:block;
margin:8px 0;
cursor:pointer;
}
 
.ergebnis{
text-align:center;
}
 
.level{
font-size:42px;
font-weight:bold;
margin:15px 0;
}
 
.bestanden{
color:green;
font-size:28px;
font-weight:bold;
}
 
.nichtbestanden{
color:#c62828;
font-size:28px;
font-weight:bold;
}
 
a{
color:var(--meer);
font-weight:bold;
text-decoration:none;
}
 
</style>
</head>
 
<body>
 
<div class="wrap">
 
<div class="card" id="start">
 
<h1>🚶 A2 Abschlusstest 1</h1>
 
<p>
Dieser Test überprüft Kenntnisse auf Niveau A2.
📚 Perfekt, Alltag, Beruf, Reisen und Kommunikation.
</p>
 
<label>👤 Vorname</label>
<input type="text" id="vorname">
 
<label>📧 E-Mail</label>
<input type="email" id="email">
 
<label>
<input type="checkbox" id="zustimmung">
Ich stimme der Speicherung und Übermittlung meines Ergebnisses zu.
</label>
 
<br><br>
 
<button class="btn" onclick="starten()">
🚀 Test starten
</button>
 
</div>
 
<div class="card" id="test" style="display:none;">
 
<h2>📚 A2 Abschlussprüfung</h2>
 
<div id="fragen"></div>
 
<button class="btn" onclick="auswerten()">
✅ Test auswerten
</button>
 
</div>
 
<div class="card" id="ergebnis" style="display:none;"></div>
 
</div>
 
<script>
 
const ACCESS_KEY="DEIN_WEB3FORMS_ACCESS_KEY";
 
const fragen=[
 
["Gestern ___ ich meine Oma besucht.",["habe","bin","hatte"],0],
 
["Wir sind um 8 Uhr ___ .",["aufgestanden","aufstehen","aufgestand"],0],
 
["Ich lerne Deutsch, ___ ich in Deutschland arbeite.",["weil","aber","oder"],0],
 
["Nächste Woche ___ wir nach Hamburg fahren.",["werden","haben","waren"],0],
 
["Kannst du mir bitte ___ helfen?",["morgen","Morgen","morgens"],0],
 
["Wann ___ du Geburtstag?",["hast","bist","hattest"],0],
 
["Sie hat gestern einen Brief ___.",["geschrieben","schreiben","geschreibt"],0],
 
["Der Zug kommt ___ 18:30 Uhr an.",["um","an","für"],0],
 
["Wir wohnen seit zwei Jahren ___ Berlin.",["in","nach","bei"],0],
 
["Ich muss heute lange ___.",["arbeiten","arbeitet","arbeitetn"],0],
 
["Letzten Sommer ___ wir nach Spanien gefahren.",["sind","haben","waren"],0],
 
["Er kann sehr gut ___.",["kochen","gekocht","kochte"],0],
 
["Ich freue mich ___ den Urlaub.",["auf","an","mit"],0],
 
["Am Wochenende haben wir Freunde ___.",["getroffen","treffen","trifft"],0],
 
["Meine Schwester geht einkaufen, ___ sie Milch braucht.",["weil","deshalb","oder"],0],
 
["Wo hast du Deutsch ___?",["gelernt","lernen","gelernte"],0],
 
["Bitte ruf mich an, ___ du Zeit hast.",["wenn","weil","dass"],0],
 
["Ich möchte später einmal Arzt ___.",["werden","wird","wurde"],0],
 
["Wie lange ___ du schon hier?",["wohnst","wohnen","wohnt"],0],
 
["Wir haben gestern Abend einen Film ___.",["gesehen","sehen","geseht"],0]
 
];
 
let vorname="";
let email="";
 
function starten(){
 
vorname=document.getElementById("vorname").value.trim();
email=document.getElementById("email").value.trim();
 
if(!vorname){
alert("Bitte Vorname eingeben.");
return;
}
 
if(!email){
alert("Bitte E-Mail eingeben.");
return;
}
 
if(!document.getElementById("zustimmung").checked){
alert("Bitte Zustimmung aktivieren.");
return;
}
 
document.getElementById("start").style.display="none";
document.getElementById("test").style.display="block";
 
bauen();
 
}
 
function bauen(){
 
let html="";
 
fragen.forEach((f,index)=>{
 
html+=`
<div class="frage">
 
<h3>${index+1}. ${f[0]}</h3>
 
`;
 
f[1].forEach((a,aindex)=>{
 
html+=`
 
<label class="option">
<input type="radio"
name="f${index}"
value="${aindex}">
${a}
</label>
 
`;
 
});
 
html+="</div>";
 
});
 
document.getElementById("fragen").innerHTML=html;
 
}
 
async function auswerten(){
 
let punkte=0;
let offen=0;
 
fragen.forEach((f,index)=>{
 
const a=document.querySelector(
'input[name="f'+index+'"]:checked'
);
 
if(!a){
offen++;
return;
}
 
if(Number(a.value)===f[2]){
punkte++;
}
 
});
 
if(offen>0){
alert("Bitte alle Fragen beantworten.");
return;
}
 
const prozent=Math.round(
punkte*100/fragen.length
);
 
const bestanden=prozent>=70;
 
document.getElementById("test").style.display="none";
document.getElementById("ergebnis").style.display="block";
 
document.getElementById("ergebnis").innerHTML=`
 
<div class="ergebnis">
 
<h2>🏆 Ergebnis A2 Test 1</h2>
 
<h3>${vorname}</h3>
 
<div class="level">
${prozent}%
</div>
 
<p>
${punkte} von ${fragen.length} Punkten
</p>
 
<div class="${
bestanden
?
"bestanden"
:
"nichtbestanden"
}">
${bestanden
?
"✅ Bestanden"
:
"❌ Nicht bestanden"}
</div>
 
<p>
Niveau:
<strong>A2</strong>
</p>
 
${
bestanden
?
"<p>🎉 Glückwunsch! Du hast A2 bestanden.</p>"
:
"<p>📚 Bitte wiederhole die A2-Themen und versuche es erneut.</p>"
}
 
<br><br>
 
<a href='index.html'>
🏠 Zur Startseite
</a>
 
</div>
 
`;
 
senden(
punkte,
prozent,
bestanden
);
 
}
 
async function senden(
punkte,
prozent,
bestanden
){
 
try{
 
await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
 
access_key:ACCESS_KEY,
 
subject:
"A2 Abschlusstest 1 - "+vorname,
 
Vorname:vorname,
Email:email,
 
Test:"A2 Abschlusstest 1",
 
Punkte:
punkte+"/"+fragen.length,
 
Prozent:prozent,
 
Ergebnis:
bestanden
?
"Bestanden"
:
"Nicht bestanden"
 
})
}
);
 
}catch(error){
 
console.log(error);
 
}
 
}
 
</script>
 
</body>
</html>
