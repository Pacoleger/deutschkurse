<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kursanmeldung</title>
<style>
:root{--tinte:#1b2a41;--papier:#f5f7fa;--sonne:#ffc83d;--meer:#1f7a8c;--weiss:#fff;--linie:#d5dce5;}
*{box-sizing:border-box;}
body{margin:0;background:var(--papier);font-family:"Segoe UI",sans-serif;color:var(--tinte);}
.wrap{max-width:700px;margin:auto;padding:30px 20px;}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.08);}
h1{margin-top:0;}
label{display:block;font-weight:700;margin:1rem 0 0.3rem;}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:12px;border:2px solid var(--linie);border-radius:10px;font-size:16px;font-family:inherit;
}
textarea{min-height:100px;resize:vertical;}
.btn{background:var(--tinte);color:white;border:none;padding:14px 25px;border-radius:999px;cursor:pointer;font-weight:bold;font-size:16px;margin-top:1.5rem;}
.btn:hover{background:#101d31;}
.hinweis{font-size:0.9rem;color:#4a5a70;margin-top:1rem;}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📝 Kursanmeldung</h1>
<p>Füllen Sie das Formular aus. Ich melde mich innerhalb von zwei Werktagen bei Ihnen.</p>

<form id="anmeldungForm">
  <label for="zielgruppe">Ich melde mich an als *</label>
  <select id="zielgruppe" name="Zielgruppe" required>
    <option value="">Bitte wählen</option>
    <option value="Erwachsener">Erwachsener</option>
    <option value="Schüler/in">Schüler/in</option>
    <option value="Geflüchtete/r">Geflüchtete/r</option>
  </select>

  <label for="vorname">Vorname *</label>
  <input type="text" id="vorname" name="Vorname" required>

  <label for="nachname">Nachname *</label>
  <input type="text" id="nachname" name="Nachname" required>

  <label for="email">E-Mail *</label>
  <input type="email" id="email" name="Email" required>

  <label for="telefon">Telefon (optional)</label>
  <input type="tel" id="telefon" name="Telefon">

  <label for="niveau">Gewünschtes Niveau (falls bekannt)</label>
  <select id="niveau" name="Niveau">
    <option value="">Weiß ich nicht / Einstufungstest gewünscht</option>
    <option>A1</option><option>A2</option><option>B1</option>
    <option>B2</option><option>C1</option><option>C2</option>
  </select>

  <label for="nachricht">Nachricht / Besondere Wünsche</label>
  <textarea id="nachricht" name="Nachricht" placeholder="z. B. abends, Wochenende, Einzelunterricht..."></textarea>

  <label style="display:flex;gap:0.6rem;align-items:flex-start;margin-top:1.2rem;font-weight:normal;">
    <input type="checkbox" id="datenschutz" required style="margin-top:4px;">
    <span>Ich stimme zu, dass meine Daten zur Bearbeitung der Anmeldung gespeichert und an die Kursleitung gesendet werden. *</span>
  </label>

  <button type="submit" class="btn">🚀 Anmeldung senden</button>
</form>

<p class="hinweis" id="status"></p>
</div>
</div>

<script>
const ACCESS_KEY = "24db5065-e8ba-40e7-9b38-c10649f3be16";

document.getElementById("anmeldungForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("status");
  status.textContent = "Wird gesendet ...";

  const daten = {
    access_key: ACCESS_KEY,
    subject: "Neue Kursanmeldung: " + document.getElementById("vorname").value + " " + document.getElementById("nachname").value,
    Zielgruppe: document.getElementById("zielgruppe").value,
    Vorname: document.getElementById("vorname").value,
    Nachname: document.getElementById("nachname").value,
    Email: document.getElementById("email").value,
    Telefon: document.getElementById("telefon").value,
    Niveau: document.getElementById("niveau").value,
    Nachricht: document.getElementById("nachricht").value
  };

  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(daten)
    });
    const j = await r.json();
    if (j.success) {
      status.textContent = "✅ Danke! Ihre Anmeldung wurde gesendet.";
      document.getElementById("anmeldungForm").reset();
    } else {
      status.textContent = "❌ Fehler beim Senden. Bitte per E-Mail melden.";
    }
  } catch (err) {
    status.textContent = "❌ Fehler beim Senden. Bitte per E-Mail melden.";
  }
});
</script>
</body>
</html>
