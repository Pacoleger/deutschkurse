<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>A2 Abschlusstest 2</title>
 
<style>
 
:root{
--tinte:#1b2a41;
--papier:#f5f7fa;
--sonne:#ffc83d;
--meer:#1f7a8c;
--weiss:#fff;
--linie:#d5dce5;
}
 
*{
box-sizing:border-box;
}
 
body{
margin:0;
background:var(--papier);
font-family:"Segoe UI",sans-serif;
color:var(--tinte);
}
 
.wrap{
max-width:900px;
margin:auto;
padding:20px;
}
 
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}
 
h1,h2{
margin-top:0;
}
 
input[type=text],
input[type=email]{
width:100%;
padding:12px;
margin-bottom:15px;
border:2px solid var(--linie);
border-radius:10px;
}
 
.btn{
background:var(--tinte);
color:white;
border:none;
padding:14px 25px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}
 
.btn:hover{
background:#101d31;
}
 
.frage{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:1px solid var(--linie);
}
 
.option{
display:block;
margin:8px 0;
cursor:pointer;
}
 
.ergebnis{
text-align:center;
}
 
.level{
font-size:42px;
font-weight:bold;
margin:15px 0;
}
 
.bestanden{
color:green;
font-size:28px;
font-weight:bold;
}
 
.nichtbestanden{
color:#c62828;
font-size:28px;
font-weight:bold;
}
 
a{
color:var(--meer);
font-weight:bold;
text-decoration:none;
}
 
</style>
</head>
 
<body>
 
<div class="wrap">
 
<div class="card" id="start">
 
<h1>🚶📚 A2 Abschlusstest 2</h1>
 
<p>
A2 Abschlussprüfung Variante 2 ⭐⭐
<br>
Schwerpunkte:
Perfekt, Reisen, Arbeit, Alltag und Nebensätze.
</p>
 
<label>👤 Vorname</label>
<input type="text" id="vorname">
 
<label>📧 E-Mail</label>
<input type="email" id="email">
 
<label>
<input type="checkbox" id="zustimmung">
Ich stimme der Speicherung und Übermittlung meines Ergebnisses zu.
</label>
 
<br><br>
 
<button class="btn" onclick="starten()">
🚀 Test starten
</button>
 
</div>
 
<div class="card" id="test" style="display:none;">
 
<h2>📚 A2 Abschlussprüfung</h2>
 
<div id="fragen"></div>
 
<button class="btn" onclick="auswerten()">
✅ Test auswerten
</button>
 
</div>
 
<div class="card" id="ergebnis" style="display:none;"></div>
 
</div>
 
<script>
 
const ACCESS_KEY="DEIN_WEB3FORMS_ACCESS_KEY";
 
const fragen=[
 
["Am Wochenende ___ ich meine Freunde besucht.",["habe","bin","hatte"],0],
 
["Wir sind gestern sehr spät nach Hause ___.",["gekommen","kommen","kommt"],0],
 
["Ich lerne Deutsch, ___ ich eine Ausbildung machen möchte.",["weil","aber","oder"],0],
 
["Wenn ich Zeit habe, ___ ich meine Eltern.",["besuche","besucht","besuchen"],0],
 
["Meine Kollegin hat eine interessante E-Mail ___.",["geschrieben","schreiben","geschreibt"],0],
 
["Der Arzttermin ist ___ Montag.",["am","im","um"],0],
 
["Kannst du mir sagen, ___ der Bahnhof ist?",["wo","wann","warum"],0],
 
["Wir fahren im Sommer ___ Italien.",["nach","in","zu"],0],
 
["Ich habe heute keine Zeit, ___ ich viel arbeiten muss.",["weil","wenn","dass"],0],
 
["Er hat gestern sein Handy ___.",["verloren","verlieren","verliert"],0],
 
["Meine Schwester interessiert sich ___ Musik.",["für","an","mit"],0],
 
["Wann hast du Deutsch ___?",["gelernt","lernen","gelernte"],0],
 
["Sie möchte später Ingenieurin ___.",["werden","wird","geworden"],0],
 
["Wir mussten lange auf den Bus ___.",["warten","wartenen","gewartet"],0],
 
["Der Film war spannend, ___ etwas zu lang.",["aber","weil","dass"],0],
 
["Ich freue mich ___ die Ferien.",["auf","an","von"],0],
 
["Letztes Jahr ___ wir nach Österreich gefahren.",["sind","haben","waren"],0],
 
["Bitte rufen Sie mich an, ___ Sie angekommen sind.",["wenn","weil","ob"],0],
 
["Ich habe den Schlüssel nicht gefunden und ___ lange gesucht.",["habe","bin","werde"],0],
 
["Im Restaurant möchte ich gern einen Salat und ein Wasser ___.",["bestellen","bestellt","bestellte"],0]
 
];
 
let vorname="";
let email="";
 
function starten(){
 
vorname=document.getElementById("vorname").value.trim();
email=document.getElementById("email").value.trim();
 
if(!vorname){
alert("Bitte Vorname eingeben.");
return;
}
 
if(!email){
alert("Bitte E-Mail eingeben.");
return;
}
 
if(!document.getElementById("zustimmung").checked){
alert("Bitte Zustimmung aktivieren.");
return;
}
 
document.getElementById("start").style.display="none";
document.getElementById("test").style.display="block";
 
fragenAufbauen();
 
}
 
function fragenAufbauen(){
 
let html="";
 
fragen.forEach((f,index)=>{
 
html+=`
<div class="frage">
<h3>${index+1}. ${f[0]}</h3>
`;
 
f[1].forEach((antwort,aindex)=>{
 
html+=`
<label class="option">
<input type="radio" name="f${index}" value="${aindex}">
${antwort}
</label>
`;
 
});
 
html+=`</div>`;
 
});
 
document.getElementById("fragen").innerHTML=html;
 
}
 
async function auswerten(){
 
let punkte=0;
let offen=0;
 
fragen.forEach((f,index)=>{
 
const a=document.querySelector(
'input[name="f'+index+'"]:checked'
);
 
if(!a){
offen++;
return;
}
 
if(Number(a.value)===f[2]){
punkte++;
}
 
});
 
if(offen>0){
alert("Bitte alle Fragen beantworten.");
return;
}
 
const prozent=Math.round(
punkte*100/fragen.length
);
 
const bestanden=prozent>=70;
 
document.getElementById("test").style.display="none";
document.getElementById("ergebnis").style.display="block";
 
document.getElementById("ergebnis").innerHTML=`
 
<div class="ergebnis">
 
<h2>🏆 Ergebnis A2 Test 2</h2>
 
<h3>${vorname}</h3>
 
<div class="level">
${prozent}%
</div>
 
<p>
${punkte} von ${fragen.length} Punkten
</p>
 
<div class="${
bestanden
?
"bestanden"
:
"nichtbestanden"
}">
${bestanden
?
"✅ Bestanden"
:
"❌ Nicht bestanden"}
</div>
 
<p>
Niveau:
<strong>A2</strong>
</p>
 
${
bestanden
?
"<p>🎉 Sehr gut! Du hast A2 Test 2 bestanden.</p>"
:
"<p>📚 Bitte übe noch etwas und versuche den Test erneut.</p>"
}
 
<br><br>
 
<a href="index.html">
🏠 Zur Startseite
</a>
 
</div>
 
`;
 
senden(
punkte,
prozent,
bestanden
);
 
}
 
async function senden(
punkte,
prozent,
bestanden
){
 
try{
 
await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
 
access_key:ACCESS_KEY,
 
subject:
"A2 Abschlusstest 2 - "+vorname,
 
Vorname:vorname,
Email:email,
 
Test:"A2 Abschlusstest 2",
 
Punkte:
punkte+"/"+fragen.length,
 
Prozent:prozent,
 
Ergebnis:
bestanden
?
"Bestanden"
:
"Nicht bestanden"
 
})
}
);
 
}catch(error){
 
console.log(error);
 
}
 
}
 
</script>
 
</body>
</html>
