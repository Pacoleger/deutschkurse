<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>A2 Abschlusstest 3</title>
 
<style>
 
:root{
--tinte:#1b2a41;
--papier:#f5f7fa;
--sonne:#ffc83d;
--meer:#1f7a8c;
--weiss:#fff;
--linie:#d5dce5;
}
 
*{box-sizing:border-box;}
 
body{
margin:0;
background:var(--papier);
font-family:"Segoe UI",sans-serif;
color:var(--tinte);
}
 
.wrap{
max-width:900px;
margin:auto;
padding:20px;
}
 
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}
 
input[type=text],
input[type=email]{
width:100%;
padding:12px;
margin-bottom:15px;
border:2px solid var(--linie);
border-radius:10px;
}
 
.btn{
background:var(--tinte);
color:white;
border:none;
padding:14px 25px;
border-radius:999px;
cursor:pointer;
font-weight:bold;
}
 
.btn:hover{
background:#101d31;
}
 
.frage{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:1px solid var(--linie);
}
 
.option{
display:block;
margin:8px 0;
}
 
.ergebnis{
text-align:center;
}
 
.level{
font-size:42px;
font-weight:bold;
margin:15px 0;
}
 
.bestanden{
color:green;
font-size:28px;
font-weight:bold;
}
 
.nichtbestanden{
color:#c62828;
font-size:28px;
font-weight:bold;
}
 
a{
color:var(--meer);
text-decoration:none;
font-weight:bold;
}
 
</style>
</head>
 
<body>
 
<div class="wrap">
 
<div class="card" id="start">
 
<h1>🚶📘 A2 Abschlusstest 3</h1>
 
<p>
A2 Abschlussprüfung Variante 3 ⭐⭐⭐
<br>
Fortgeschrittenes A2 mit trennbaren Verben, Perfekt,
indirekten Fragen und Nebensätzen.
</p>
 
<label>👤 Vorname</label>
<input type="text" id="vorname">
 
<label>📧 E-Mail</label>
<input type="email" id="email">
 
<label>
<input type="checkbox" id="zustimmung">
Ich stimme der Speicherung und Übermittlung meines Ergebnisses zu.
</label>
 
<br><br>
 
<button class="btn" onclick="starten()">
🚀 Test starten
</button>
 
</div>
 
<div class="card" id="test" style="display:none;">
 
<h2>📚 A2 Abschlussprüfung</h2>
 
<div id="fragen"></div>
 
<button class="btn" onclick="auswerten()">
✅ Test auswerten
</button>
 
</div>
 
<div class="card" id="ergebnis" style="display:none;"></div>
 
</div>
 
<script>
 
const ACCESS_KEY="DEIN_WEB3FORMS_ACCESS_KEY";
 
const fragen=[
 
["Ich weiß nicht, ___ der Zug ankommt.",["wo","wann","weil"],1],
 
["Kannst du mir sagen, ___ die Bank ist?",["wann","wo","obwohl"],1],
 
["Gestern habe ich meinen Chef ___.",["angerufen","anrufen","ruft an"],0],
 
["Wir sind um 6 Uhr ___.",["aufgestanden","aufstehen","aufsteht"],0],
 
["Sie lernt Deutsch, ___ sie in Deutschland arbeiten möchte.",["weil","aber","oder"],0],
 
["Wenn ich Zeit habe, ___ ich meine Großeltern.",["besuche","besucht","besuchen"],0],
 
["Der Film war interessant, ___ etwas lang.",["aber","weil","dass"],0],
 
["Ich habe gestern lange ___.",["eingekauft","einkaufen","kauft ein"],0],
 
["Kannst du bitte das Fenster ___?",["zumachen","zugemacht","macht zu"],0],
 
["Letzte Woche ___ wir an die Ostsee gefahren.",["sind","haben","waren"],0],
 
["Meine Kollegin hat mir gesagt, ___ die Besprechung morgen stattfindet.",["dass","weil","wenn"],0],
 
["Wir freuen uns ___ den Urlaub.",["auf","für","mit"],0],
 
["Ich habe keine Zeit, ___ ich noch arbeiten muss.",["weil","dass","aber"],0],
 
["Die Kinder haben ihr Zimmer ___.",["aufgeräumt","aufräumen","räumt auf"],0],
 
["Wann hast du angefangen, Deutsch zu ___?",["lernen","gelernt","lernst"],0],
 
["Mein Bruder möchte Ingenieur ___.",["werden","wird","geworden"],0],
 
["Ich interessiere mich ___ Computertechnik.",["für","an","mit"],0],
 
["Er hat gefragt, ___ ich morgen komme.",["ob","weil","dass"],0],
 
["Am Wochenende haben wir Freunde ___.",["besucht","besuchen","besuchtet"],0],
 
["Bitte gib mir Bescheid, ___ du fertig bist.",["wenn","weil","dass"],0]
 
];
 
let vorname="";
let email="";
 
function starten(){
 
vorname=document.getElementById("vorname").value.trim();
email=document.getElementById("email").value.trim();
 
if(!vorname){
alert("Bitte Vorname eingeben.");
return;
}
 
if(!email){
alert("Bitte E-Mail eingeben.");
return;
}
 
if(!document.getElementById("zustimmung").checked){
alert("Bitte Zustimmung aktivieren.");
return;
}
 
document.getElementById("start").style.display="none";
document.getElementById("test").style.display="block";
 
fragenAufbauen();
 
}
 
function fragenAufbauen(){
 
let html="";
 
fragen.forEach((f,index)=>{
 
html+=`
<div class="frage">
<h3>${index+1}. ${f[0]}</h3>
`;
 
f[1].forEach((antwort,aindex)=>{
 
html+=`
<label class="option">
<input type="radio"
name="f${index}"
value="${aindex}">
${antwort}
</label>
`;
 
});
 
html+=`</div>`;
 
});
 
document.getElementById("fragen").innerHTML=html;
 
}
 
async function auswerten(){
 
let punkte=0;
let offen=0;
 
fragen.forEach((f,index)=>{
 
const a=document.querySelector(
'input[name="f'+index+'"]:checked'
);
 
if(!a){
offen++;
return;
}
 
if(Number(a.value)===f[2]){
punkte++;
}
 
});
 
if(offen>0){
alert("Bitte alle Fragen beantworten.");
return;
}
 
const prozent=Math.round(
punkte*100/fragen.length
);
 
const bestanden=prozent>=70;
 
document.getElementById("test").style.display="none";
document.getElementById("ergebnis").style.display="block";
 
document.getElementById("ergebnis").innerHTML=`
 
<div class="ergebnis">
 
<h2>🏆 Ergebnis A2 Test 3</h2>
 
<h3>${vorname}</h3>
 
<div class="level">
${prozent}%
</div>
 
<p>
${punkte} von ${fragen.length} Punkten
</p>
 
<div class="${
bestanden
?
"bestanden"
:
"nichtbestanden"
}">
${bestanden
?
"✅ Bestanden"
:
"❌ Nicht bestanden"}
</div>
 
<p>
<strong>Niveau A2</strong>
</p>
 
${
bestanden
?
"<p>🎉 Sehr gut! Du beherrschst die wichtigsten A2-Themen.</p>"
:
"<p>📚 Wiederhole noch die A2-Grammatik und versuche es erneut.</p>"
}
 
<br><br>
 
<a href='index.html'>
🏠 Zur Startseite
</a>
 
</div>
 
`;
 
senden(punkte,prozent,bestanden);
 
}
 
async function senden(
punkte,
prozent,
bestanden
){
 
try{
 
await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
 
access_key:ACCESS_KEY,
 
subject:
"A2 Abschlusstest 3 - "+vorname,
 
Vorname:vorname,
Email:email,
 
Test:"A2 Abschlusstest 3",
 
Punkte:
punkte+"/"+fragen.length,
 
Prozent:prozent,
 
Ergebnis:
bestanden
?
"Bestanden"
:
"Nicht bestanden"
 
})
}
);
 
}catch(error){
 
console.log(error);
 
}
 
}
 
</script>
 
</body>
</html>
